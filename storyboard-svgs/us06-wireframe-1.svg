<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Arial, Helvetica, sans-serif">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="36" ry="36" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="375" height="44" rx="36" ry="36" fill="#f5f5f5"/>
    <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
    <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9:41</text>
    <!-- Signal Bars -->
    <rect x="30" y="20" width="3" height="6" rx="1" fill="#333"/>
    <rect x="35" y="18" width="3" height="8" rx="1" fill="#333"/>
    <rect x="40" y="15" width="3" height="11" rx="1" fill="#333"/>
    <rect x="45" y="12" width="3" height="14" rx="1" fill="#333"/>
    <!-- Battery -->
    <rect x="325" y="16" width="22" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="347" y="20" width="2" height="4" rx="1" fill="#333"/>
    <rect x="327" y="18" width="16" height="8" rx="1" fill="#333"/>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(0,44)">
    <rect x="0" y="0" width="375" height="56" fill="#fff"/>
    <line x1="0" y1="56" x2="375" y2="56" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Hamburger Menu -->
    <line x1="20" y1="20" x2="40" y2="20" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="40" y2="28" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="40" y2="36" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Title -->
    <text x="187" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Ultra</text>
    <!-- Bell Icon -->
    <circle cx="348" cy="24" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="16" x2="348" y2="12" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <circle cx="348" cy="34" r="2" fill="#333"/>
  </g>

  <!-- Page Header -->
  <g transform="translate(0,110)">
    <text x="20" y="28" font-size="13" fill="#666">&lt;</text>
    <text x="36" y="28" font-size="18" font-weight="bold" fill="#333">Book a Ride</text>
  </g>

  <!-- From Field -->
  <g transform="translate(20,160)">
    <rect x="0" y="0" width="335" height="56" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="16" y="22" font-size="11" fill="#999">FROM</text>
    <text x="16" y="42" font-size="15" fill="#333">742 Elm St (Home)</text>
    <!-- Home icon -->
    <g transform="translate(300,18)">
      <rect x="2" y="8" width="14" height="12" rx="1" fill="none" stroke="#999" stroke-width="1.5"/>
      <polyline points="0,10 9,2 18,10" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Dots connector -->
  <circle cx="38" cy="222" r="2" fill="#999"/>
  <circle cx="38" cy="230" r="2" fill="#999"/>
  <circle cx="38" cy="238" r="2" fill="#999"/>

  <!-- To Field -->
  <g transform="translate(20,248)">
    <rect x="0" y="0" width="335" height="56" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="16" y="22" font-size="11" fill="#999">TO</text>
    <text x="16" y="42" font-size="15" fill="#333">Metro General Hospital</text>
    <!-- Location pin icon -->
    <g transform="translate(302,16)">
      <circle cx="7" cy="8" r="4" fill="none" stroke="#999" stroke-width="1.5"/>
      <path d="M7,12 L7,22" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Fare Estimate Card -->
  <g transform="translate(20,330)">
    <rect x="0" y="0" width="335" height="80" rx="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" fill="#999">Estimated fare</text>
    <text x="20" y="58" font-size="28" font-weight="bold" fill="#333">$19.00</text>
    <!-- Dollar circle icon -->
    <circle cx="295" cy="40" r="20" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="295" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#999">$</text>
  </g>

  <!-- Split Fare Toggle -->
  <g transform="translate(20,430)">
    <rect x="0" y="0" width="335" height="52" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Toggle track (inactive) -->
    <rect x="250" y="14" width="48" height="24" rx="12" fill="#e0e0e0"/>
    <!-- Toggle knob (left = off) -->
    <circle cx="264" cy="26" r="10" fill="#fff" stroke="#999" stroke-width="1"/>
    <text x="20" y="32" font-size="15" fill="#333">Split Fare</text>
    <!-- People icon -->
    <circle cx="220" cy="22" r="7" fill="none" stroke="#999" stroke-width="1.5"/>
    <path d="M210,34 Q215,28 220,28 Q225,28 230,34" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="232" cy="22" r="5" fill="none" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- Vehicle Type Selector -->
  <g transform="translate(20,505)">
    <text x="0" y="0" font-size="13" fill="#999">Vehicle Type</text>

    <!-- UltraX (selected) -->
    <rect x="0" y="14" width="105" height="72" rx="12" fill="#333" stroke="#333" stroke-width="2"/>
    <rect x="22" y="30" width="60" height="24" rx="4" fill="#666"/>
    <circle cx="34" cy="58" r="6" fill="#999"/>
    <circle cx="70" cy="58" r="6" fill="#999"/>
    <text x="52" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">UltraX</text>

    <!-- UltraXL -->
    <rect x="115" y="14" width="105" height="72" rx="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
    <rect x="137" y="30" width="60" height="28" rx="4" fill="#f5f5f5"/>
    <circle cx="149" cy="62" r="6" fill="#e0e0e0"/>
    <circle cx="185" cy="62" r="6" fill="#e0e0e0"/>
    <text x="167" y="82" text-anchor="middle" font-size="12" fill="#666">UltraXL</text>

    <!-- UltraLux -->
    <rect x="230" y="14" width="105" height="72" rx="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
    <rect x="252" y="30" width="60" height="28" rx="4" fill="#f5f5f5"/>
    <circle cx="264" cy="62" r="6" fill="#e0e0e0"/>
    <circle cx="300" cy="62" r="6" fill="#e0e0e0"/>
    <text x="282" y="82" text-anchor="middle" font-size="12" fill="#666">UltraLux</text>
  </g>

  <!-- Request Ride Button -->
  <g transform="translate(20,700)">
    <rect x="0" y="0" width="335" height="54" rx="27" fill="#333"/>
    <text x="167" y="33" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Request Ride</text>
  </g>

  <!-- Bottom Bar Indicator -->
  <rect x="120" y="790" width="135" height="5" rx="3" fill="#333"/>
</svg>
