<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <clipPath id="screenClip2">
      <rect x="0" y="0" width="375" height="812" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="40" ry="40" fill="#fff" stroke="#333" stroke-width="2"/>

  <g clip-path="url(#screenClip2)">

    <!-- Status Bar -->
    <rect x="0" y="0" width="375" height="44" fill="#fff"/>
    <text x="187" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9:41</text>
    <!-- Signal bars -->
    <rect x="20" y="20" width="3" height="6" rx="1" fill="#333"/>
    <rect x="25" y="17" width="3" height="9" rx="1" fill="#333"/>
    <rect x="30" y="14" width="3" height="12" rx="1" fill="#333"/>
    <rect x="35" y="11" width="3" height="15" rx="1" fill="#333"/>
    <!-- Battery -->
    <rect x="330" y="17" width="22" height="11" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="352" y="20" width="2" height="5" rx="1" fill="#333"/>
    <rect x="332" y="19" width="16" height="7" rx="1" fill="#333"/>

    <!-- Navigation Bar -->
    <rect x="0" y="44" width="375" height="56" fill="#fff"/>
    <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Back arrow -->
    <path d="M24 72 L14 72" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 66 L12 72 L18 78" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Title -->
    <text x="48" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Weekly Ride Pass</text>

    <!-- Route Info -->
    <rect x="0" y="100" width="375" height="70" fill="#f5f5f5"/>
    <text x="20" y="128" font-family="Arial" font-size="12" fill="#999" text-transform="uppercase" letter-spacing="1">YOUR ROUTE</text>
    <text x="20" y="152" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Home  &#x2192;  Office</text>
    <line x1="0" y1="170" x2="375" y2="170" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Current spending callout -->
    <rect x="20" y="186" width="335" height="50" rx="10" fill="#f5f5f5"/>
    <text x="36" y="210" font-family="Arial" font-size="13" fill="#666">Your current avg:</text>
    <text x="170" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#333">~$100/week</text>
    <text x="265" y="210" font-family="Arial" font-size="12" fill="#999">(pay-per-ride)</text>

    <!-- Section label -->
    <text x="20" y="270" font-family="Arial" font-size="13" fill="#999" letter-spacing="0.5">CHOOSE YOUR PLAN</text>

    <!-- Plan Card 1 (Selected / highlighted) -->
    <rect x="20" y="288" width="335" height="160" rx="14" fill="#333"/>
    <!-- Checkmark circle -->
    <circle cx="330" cy="312" r="14" fill="#fff"/>
    <polyline points="322,312 327,318 339,306" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Best Value badge -->
    <rect x="36" y="298" width="80" height="22" rx="11" fill="#666"/>
    <text x="76" y="313" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">BEST VALUE</text>
    <!-- Plan details -->
    <text x="36" y="350" font-family="Arial" font-size="22" font-weight="bold" fill="#fff">5 Rides / Week</text>
    <text x="36" y="382" font-family="Arial" font-size="28" font-weight="bold" fill="#fff">$75<tspan font-size="14" fill="#e0e0e0">/week</tspan></text>
    <line x1="36" y1="398" x2="320" y2="398" stroke="#666" stroke-width="0.5"/>
    <text x="36" y="424" font-family="Arial" font-size="14" fill="#e0e0e0">Save ~$25 vs pay-per-ride</text>

    <!-- Plan Card 2 -->
    <rect x="20" y="466" width="335" height="150" rx="14" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
    <!-- Unselected circle -->
    <circle cx="330" cy="490" r="14" fill="none" stroke="#e0e0e0" stroke-width="2"/>
    <!-- Plan details -->
    <text x="36" y="510" font-family="Arial" font-size="12" fill="#999" letter-spacing="0.5">STANDARD</text>
    <text x="36" y="540" font-family="Arial" font-size="22" font-weight="bold" fill="#333">3 Rides / Week</text>
    <text x="36" y="572" font-family="Arial" font-size="28" font-weight="bold" fill="#333">$48<tspan font-size="14" fill="#999">/week</tspan></text>
    <line x1="36" y1="586" x2="320" y2="586" stroke="#e0e0e0" stroke-width="0.5"/>
    <text x="36" y="604" font-family="Arial" font-size="14" fill="#999">Save ~$12 vs pay-per-ride</text>

    <!-- Comparison summary -->
    <rect x="20" y="634" width="335" height="46" rx="10" fill="#f5f5f5"/>
    <text x="187" y="662" font-family="Arial" font-size="13" fill="#666" text-anchor="middle">With 5-ride pass you save <tspan font-weight="bold" fill="#333">25% every week</tspan></text>

    <!-- Select Plan Button -->
    <rect x="20" y="700" width="335" height="54" rx="27" fill="#333"/>
    <text x="187" y="733" font-family="Arial" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Select Plan</text>

  </g>
</svg>