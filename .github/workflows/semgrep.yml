name: Semgrep

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    # Weekly Monday morning scan of main, in case rules change while no PRs land.
    - cron: "17 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: semgrep ci
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        # `semgrep ci` picks rule packs from --config=auto based on the
        # detected languages (TS / JS / React + secrets + OWASP Top 10).
        # If SEMGREP_APP_TOKEN is set as a repo secret, results also stream
        # to the Semgrep dashboard at semgrep.dev. The token is optional —
        # the workflow runs fine without it (Path 1 in issue #86).
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci --config=auto --sarif --output=semgrep.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
