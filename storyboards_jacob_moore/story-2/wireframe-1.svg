<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="12" fill="#333">LTE</text>
  <!-- Battery icon -->
  <rect x="332" y="23" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="354" y="26" width="2" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="334" y="25" width="16" height="7" rx="1" ry="1" fill="#333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Back Arrow -->
  <polyline points="25,72 15,72 15,72" fill="none" stroke="#333" stroke-width="0"/>
  <text x="20" y="76" font-family="Arial, sans-serif" font-size="22" fill="#333">&lt;</text>
  <text x="50" y="78" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">Choose a Ride</text>

  <!-- Mini Map Area -->
  <rect x="20" y="115" width="335" height="150" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Route line -->
  <circle cx="80" cy="190" r="8" fill="#333"/>
  <text x="74" y="194" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold">A</text>
  <line x1="88" y1="190" x2="280" y2="190" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="290" cy="190" r="8" fill="#999"/>
  <text x="284" y="194" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="bold">B</text>
  <!-- Map label -->
  <text x="140" y="165" font-family="Arial, sans-serif" font-size="11" fill="#999">Route Preview</text>

  <!-- Ride Option 1: Standard -->
  <rect x="20" y="285" width="335" height="100" rx="12" ry="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Car icon -->
  <rect x="40" y="315" width="50" height="22" rx="4" ry="4" fill="#e0e0e0"/>
  <rect x="48" y="307" width="34" height="14" rx="3" ry="3" fill="#e0e0e0"/>
  <circle cx="52" cy="340" r="6" fill="#999"/>
  <circle cx="78" cy="340" r="6" fill="#999"/>
  <!-- Text -->
  <text x="110" y="325" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">Standard</text>
  <text x="110" y="350" font-family="Arial, sans-serif" font-size="14" fill="#999">4 min away</text>
  <text x="290" y="335" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">$14</text>

  <!-- Ride Option 2: Child-Safe (SELECTED) -->
  <rect x="20" y="400" width="335" height="100" rx="12" ry="12" fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>
  <!-- Car icon with child indicator -->
  <rect x="40" y="430" width="50" height="22" rx="4" ry="4" fill="#e0e0e0"/>
  <rect x="48" y="422" width="34" height="14" rx="3" ry="3" fill="#e0e0e0"/>
  <circle cx="52" cy="455" r="6" fill="#999"/>
  <circle cx="78" cy="455" r="6" fill="#999"/>
  <!-- Small seat icon on car -->
  <rect x="58" y="426" width="8" height="8" rx="1" ry="1" fill="#333"/>
  <!-- Text -->
  <text x="110" y="440" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">Child-Safe</text>
  <text x="110" y="465" font-family="Arial, sans-serif" font-size="14" fill="#999">6 min away</text>
  <text x="290" y="450" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">$18</text>
  <!-- Selected indicator -->
  <circle cx="340" cy="415" r="10" fill="#333"/>
  <polyline points="334,415 338,419 346,411" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ride Option 3: XL Family -->
  <rect x="20" y="515" width="335" height="100" rx="12" ry="12" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Car icon (larger) -->
  <rect x="40" y="545" width="55" height="24" rx="4" ry="4" fill="#e0e0e0"/>
  <rect x="46" y="537" width="40" height="14" rx="3" ry="3" fill="#e0e0e0"/>
  <circle cx="52" cy="572" r="6" fill="#999"/>
  <circle cx="83" cy="572" r="6" fill="#999"/>
  <!-- Text -->
  <text x="110" y="555" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">XL Family</text>
  <text x="110" y="580" font-family="Arial, sans-serif" font-size="14" fill="#999">8 min away</text>
  <text x="290" y="565" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">$22</text>

  <!-- Bottom Button -->
  <rect x="20" y="720" width="335" height="56" rx="28" ry="28" fill="#333"/>
  <text x="107" y="754" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="bold">Request Child-Safe</text>

  <!-- Bottom safe area -->
  <rect x="120" y="790" width="135" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
