<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="12" fill="#333">LTE</text>
  <!-- Battery icon -->
  <rect x="332" y="23" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="354" y="26" width="2" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="334" y="25" width="16" height="7" rx="1" ry="1" fill="#333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Back Arrow -->
  <text x="20" y="78" font-family="Arial, sans-serif" font-size="22" fill="#333">&lt;</text>
  <text x="50" y="78" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">Child Safety Setup</text>

  <!-- How many children section -->
  <text x="20" y="140" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">How many children?</text>

  <!-- Number stepper -->
  <rect x="112" y="160" width="150" height="50" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Minus button -->
  <rect x="117" y="165" width="40" height="40" rx="8" ry="8" fill="#e0e0e0"/>
  <line x1="129" y1="185" x2="145" y2="185" stroke="#333" stroke-width="2.5"/>
  <!-- Number -->
  <text x="182" y="194" font-family="Arial, sans-serif" font-size="24" fill="#333" font-weight="bold" text-anchor="middle">2</text>
  <!-- Plus button -->
  <rect x="217" y="165" width="40" height="40" rx="8" ry="8" fill="#e0e0e0"/>
  <line x1="229" y1="185" x2="245" y2="185" stroke="#333" stroke-width="2.5"/>
  <line x1="237" y1="177" x2="237" y2="193" stroke="#333" stroke-width="2.5"/>

  <!-- Child 1 Card -->
  <rect x="20" y="240" width="335" height="140" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">Child 1</text>
  <!-- Age input -->
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="14" fill="#999">Age</text>
  <rect x="85" y="288" width="60" height="30" rx="6" ry="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="110" y="308" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">6</text>
  <!-- Recommendation -->
  <rect x="160" y="288" width="175" height="30" rx="6" ry="6" fill="#e0e0e0"/>
  <text x="172" y="308" font-family="Arial, sans-serif" font-size="13" fill="#333">Car Seat</text>
  <!-- Sub label -->
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="13" fill="#999">(recommended based on age)</text>

  <!-- Child 2 Card -->
  <rect x="20" y="400" width="335" height="140" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">Child 2</text>
  <!-- Age input -->
  <text x="40" y="465" font-family="Arial, sans-serif" font-size="14" fill="#999">Age</text>
  <rect x="85" y="448" width="60" height="30" rx="6" ry="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="110" y="468" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">9</text>
  <!-- Recommendation -->
  <rect x="160" y="448" width="175" height="30" rx="6" ry="6" fill="#e0e0e0"/>
  <text x="172" y="468" font-family="Arial, sans-serif" font-size="13" fill="#333">Booster Seat</text>
  <!-- Sub label -->
  <text x="40" y="520" font-family="Arial, sans-serif" font-size="13" fill="#999">(recommended based on age)</text>

  <!-- Info Box -->
  <rect x="20" y="570" width="335" height="80" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Info icon -->
  <circle cx="45" cy="600" r="12" fill="#e0e0e0"/>
  <text x="41" y="605" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">i</text>
  <!-- Info text -->
  <text x="68" y="598" font-family="Arial, sans-serif" font-size="13" fill="#333">Vehicles will be matched with</text>
  <text x="68" y="618" font-family="Arial, sans-serif" font-size="13" fill="#333">appropriate safety equipment.</text>

  <!-- Bottom Button -->
  <rect x="20" y="720" width="335" height="56" rx="28" ry="28" fill="#333"/>
  <text x="140" y="754" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="bold">Find a Ride</text>

  <!-- Bottom safe area -->
  <rect x="120" y="790" width="135" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
