<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="12" fill="#333">LTE</text>
  <!-- Battery icon -->
  <rect x="332" y="23" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="354" y="26" width="2" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="334" y="25" width="16" height="7" rx="1" ry="1" fill="#333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <text x="82" y="78" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">Finding Your Ride...</text>

  <!-- Loading Animation (concentric circles) -->
  <circle cx="187" cy="175" r="40" fill="none" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="187" cy="175" r="28" fill="none" stroke="#999" stroke-width="2"/>
  <circle cx="187" cy="175" r="16" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="187" cy="175" r="5" fill="#333"/>
  <!-- Animated dots label -->
  <text x="142" y="240" font-family="Arial, sans-serif" font-size="14" fill="#999">Searching drivers...</text>

  <!-- Match Result Card -->
  <rect x="20" y="270" width="335" height="370" rx="16" ry="16" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Match Found label -->
  <text x="130" y="305" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">Match Found!</text>

  <!-- Driver Photo placeholder -->
  <circle cx="70" cy="365" r="32" fill="#e0e0e0"/>
  <circle cx="70" cy="355" r="12" fill="#999"/>
  <ellipse cx="70" cy="380" rx="16" ry="10" fill="#999"/>

  <!-- Driver Info -->
  <text x="118" y="352" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">James R.</text>
  <text x="118" y="378" font-family="Arial, sans-serif" font-size="16" fill="#999">4.9</text>
  <text x="142" y="378" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <!-- Rating stars small -->
  <text x="155" y="378" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="168" y="378" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="181" y="378" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="194" y="378" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0">&#9733;</text>

  <!-- Divider -->
  <line x1="40" y1="405" x2="335" y2="405" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Vehicle Info -->
  <text x="40" y="435" font-family="Arial, sans-serif" font-size="14" fill="#999">Vehicle</text>
  <text x="40" y="458" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">Toyota Highlander</text>
  <text x="230" y="458" font-family="Arial, sans-serif" font-size="16" fill="#999">White</text>

  <!-- Divider -->
  <line x1="40" y1="475" x2="335" y2="475" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Safety Equipment Verified -->
  <rect x="40" y="490" width="295" height="40" rx="8" ry="8" fill="#e0e0e0"/>
  <!-- Checkmark circle -->
  <circle cx="65" cy="510" r="12" fill="#333"/>
  <polyline points="58,510 63,515 72,505" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="85" y="515" font-family="Arial, sans-serif" font-size="15" fill="#333" font-weight="bold">Safety Equipment Verified</text>

  <!-- Equipment list -->
  <text x="40" y="560" font-family="Arial, sans-serif" font-size="15" fill="#333">&#8226;  1x Car Seat</text>
  <text x="40" y="585" font-family="Arial, sans-serif" font-size="15" fill="#333">&#8226;  1x Booster Seat</text>

  <!-- Divider -->
  <line x1="40" y1="605" x2="335" y2="605" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ETA -->
  <text x="120" y="630" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">ETA: 6 min away</text>

  <!-- Bottom Buttons -->
  <rect x="20" y="670" width="155" height="50" rx="25" ry="25" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="63" y="700" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">Cancel</text>

  <rect x="195" y="670" width="160" height="50" rx="25" ry="25" fill="#333"/>
  <text x="233" y="700" font-family="Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">Confirm</text>

  <!-- Bottom safe area -->
  <rect x="120" y="790" width="135" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
