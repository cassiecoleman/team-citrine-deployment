<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="12" fill="#333">LTE</text>
  <!-- Battery icon -->
  <rect x="332" y="23" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="354" y="26" width="2" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="334" y="25" width="16" height="7" rx="1" ry="1" fill="#333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <text x="110" y="78" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">Driver En Route</text>

  <!-- Map Area -->
  <rect x="20" y="115" width="335" height="240" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Road lines -->
  <line x1="60" y1="250" x2="320" y2="250" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="60" y1="200" x2="320" y2="200" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="8,6"/>
  <!-- Route path -->
  <path d="M100,250 C150,250 180,180 250,180 L310,180" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Car icon moving along route -->
  <rect x="155" y="198" width="36" height="18" rx="4" ry="4" fill="#333"/>
  <rect x="161" y="192" width="24" height="10" rx="2" ry="2" fill="#333"/>
  <circle cx="163" cy="218" r="4" fill="#999"/>
  <circle cx="183" cy="218" r="4" fill="#999"/>
  <!-- Direction arrow -->
  <polygon points="198,207 208,207 203,200" fill="#333"/>

  <!-- Pickup point (You) -->
  <circle cx="310" cy="180" r="10" fill="#333"/>
  <circle cx="310" cy="180" r="5" fill="#fff"/>
  <text x="290" y="168" font-family="Arial, sans-serif" font-size="11" fill="#333" font-weight="bold">You</text>

  <!-- Map label -->
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="11" fill="#999">Live tracking</text>

  <!-- Driver Info Card -->
  <rect x="20" y="375" width="335" height="260" rx="16" ry="16" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Driver Photo placeholder -->
  <circle cx="70" cy="425" r="32" fill="#e0e0e0"/>
  <circle cx="70" cy="415" r="12" fill="#999"/>
  <ellipse cx="70" cy="440" rx="16" ry="10" fill="#999"/>

  <!-- Driver Name and Rating -->
  <text x="118" y="415" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold">James R.</text>
  <text x="118" y="440" font-family="Arial, sans-serif" font-size="16" fill="#999">4.9</text>
  <text x="142" y="440" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="155" y="440" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="168" y="440" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="181" y="440" font-family="Arial, sans-serif" font-size="16" fill="#333">&#9733;</text>
  <text x="194" y="440" font-family="Arial, sans-serif" font-size="16" fill="#e0e0e0">&#9733;</text>

  <!-- Divider -->
  <line x1="40" y1="465" x2="335" y2="465" stroke="#e0e0e0" stroke-width="1"/>

  <!-- License Plate -->
  <text x="40" y="495" font-family="Arial, sans-serif" font-size="14" fill="#999">License Plate</text>
  <rect x="170" y="478" width="145" height="30" rx="6" ry="6" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="200" y="498" font-family="Arial, sans-serif" font-size="16" fill="#333" font-weight="bold">ABC 1234</text>

  <!-- Divider -->
  <line x1="40" y1="520" x2="335" y2="520" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Child Safety Badge -->
  <rect x="40" y="535" width="295" height="50" rx="10" ry="10" fill="#e0e0e0"/>
  <!-- Shield/badge icon -->
  <circle cx="72" cy="560" r="16" fill="#333"/>
  <polyline points="64,560 70,566 80,554" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="556" font-family="Arial, sans-serif" font-size="17" fill="#333" font-weight="bold">Child Safety</text>
  <text x="226" y="556" font-family="Arial, sans-serif" font-size="17" fill="#333">&#10003;</text>
  <text x="98" y="576" font-family="Arial, sans-serif" font-size="12" fill="#999">Equipment verified for this trip</text>

  <!-- Divider -->
  <line x1="40" y1="600" x2="335" y2="600" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Arriving ETA -->
  <text x="105" y="628" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">Arriving in 4 min</text>

  <!-- Bottom Buttons -->
  <rect x="20" y="670" width="160" height="50" rx="25" ry="25" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="40" y="700" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">Contact Driver</text>

  <rect x="195" y="670" width="160" height="50" rx="25" ry="25" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="222" y="700" font-family="Arial, sans-serif" font-size="14" fill="#999" font-weight="bold">Cancel Ride</text>

  <!-- Bottom safe area -->
  <rect x="120" y="790" width="135" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
