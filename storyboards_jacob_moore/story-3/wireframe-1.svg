<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="1" y="1" width="373" height="810" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">9:41</text>
  <text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">LTE</text>
  <!-- Battery icon -->
  <rect x="330" y="18" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="352" y="21" width="3" height="5" rx="1" ry="1" fill="#333333"/>
  <rect x="332" y="20" width="16" height="7" rx="1" ry="1" fill="#333333"/>

  <!-- Title Bar -->
  <rect x="0" y="44" width="375" height="50" fill="#F5F5F5"/>
  <text x="187" y="75" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold" text-anchor="middle">Trip in Progress</text>

  <!-- Map Area -->
  <rect x="15" y="110" width="345" height="300" rx="12" ry="12" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Map grid lines for texture -->
  <line x1="15" y1="170" x2="360" y2="170" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="230" x2="360" y2="230" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="290" x2="360" y2="290" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="350" x2="360" y2="350" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="100" y1="110" x2="100" y2="410" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="190" y1="110" x2="190" y2="410" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="280" y1="110" x2="280" y2="410" stroke="#DDDDDD" stroke-width="0.5"/>

  <!-- Route line (dashed) -->
  <path d="M 80 320 C 120 280, 160 200, 200 220 C 240 240, 270 180, 310 170" stroke="#666666" stroke-width="3" stroke-dasharray="8,5" fill="none"/>
  <!-- Start dot (Home) -->
  <circle cx="80" cy="320" r="8" fill="#555555" stroke="#333333" stroke-width="2"/>
  <text x="80" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Home</text>
  <!-- End dot (Soccer Fields) -->
  <circle cx="310" cy="170" r="8" fill="#888888" stroke="#333333" stroke-width="2"/>
  <text x="310" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Soccer Fields</text>
  <!-- Car position on route -->
  <rect x="185" y="210" width="30" height="18" rx="4" ry="4" fill="#444444"/>
  <text x="200" y="223" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">CAR</text>

  <!-- Driver Info Bar -->
  <rect x="15" y="425" width="345" height="80" rx="12" ry="12" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>
  <!-- Driver avatar circle -->
  <circle cx="55" cy="465" r="25" fill="#CCCCCC" stroke="#AAAAAA" stroke-width="1"/>
  <text x="55" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#777777" text-anchor="middle">JR</text>
  <!-- Driver name and rating -->
  <text x="92" y="452" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="bold">James R.</text>
  <text x="185" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">4.9</text>
  <text x="208" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#999933">&#9733;</text>
  <!-- Vehicle -->
  <text x="92" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Toyota Highlander</text>
  <!-- License plate -->
  <rect x="92" y="486" width="80" height="18" rx="3" ry="3" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="132" y="499" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">ABC-1234</text>

  <!-- ETA Display -->
  <rect x="15" y="520" width="345" height="55" rx="12" ry="12" fill="#F0F0F0" stroke="#DDDDDD" stroke-width="1"/>
  <text x="187" y="545" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">Arriving at 3:45 PM</text>
  <text x="187" y="565" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">12 min remaining</text>

  <!-- Bottom Toolbar -->
  <rect x="0" y="605" width="375" height="100" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Share Trip Button (prominent) -->
  <rect x="20" y="618" width="160" height="48" rx="10" ry="10" fill="#333333"/>
  <text x="100" y="647" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Share Trip</text>

  <!-- Safety Button -->
  <rect x="195" y="618" width="80" height="48" rx="10" ry="10" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="235" y="647" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Safety</text>

  <!-- Contact Button -->
  <rect x="285" y="618" width="75" height="48" rx="10" ry="10" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="322" y="647" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Contact</text>

  <!-- Tap indicator arrow pointing to Share Trip -->
  <circle cx="100" cy="690" r="14" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="694" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">TAP</text>
  <line x1="100" y1="676" x2="100" y2="668" stroke="#555555" stroke-width="1.5" marker-end="url(#arrowhead1)"/>
  <defs>
    <marker id="arrowhead1" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#555555"/>
    </marker>
  </defs>

  <!-- Home Indicator -->
  <rect x="140" y="788" width="95" height="5" rx="3" ry="3" fill="#CCCCCC"/>
</svg>
