<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="1" y="1" width="373" height="810" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">9:41</text>
  <text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">LTE</text>
  <!-- Battery icon -->
  <rect x="330" y="18" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="352" y="21" width="3" height="5" rx="1" ry="1" fill="#333333"/>
  <rect x="332" y="20" width="16" height="7" rx="1" ry="1" fill="#333333"/>

  <!-- Title Bar with Checkmark -->
  <rect x="0" y="44" width="375" height="50" fill="#F5F5F5"/>
  <!-- Checkmark circle -->
  <circle cx="30" cy="69" r="14" fill="#666666"/>
  <path d="M 22 69 L 28 76 L 39 63" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="75" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Trip Complete</text>

  <!-- Map Area showing completed route -->
  <rect x="15" y="110" width="345" height="250" rx="12" ry="12" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Map grid lines -->
  <line x1="15" y1="165" x2="360" y2="165" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="220" x2="360" y2="220" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="275" x2="360" y2="275" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="330" x2="360" y2="330" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="100" y1="110" x2="100" y2="360" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="190" y1="110" x2="190" y2="360" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="280" y1="110" x2="280" y2="360" stroke="#DDDDDD" stroke-width="0.5"/>

  <!-- Completed route (solid line) -->
  <path d="M 80 290 C 120 255, 160 185, 200 195 C 240 205, 270 160, 310 150" stroke="#555555" stroke-width="3" fill="none"/>

  <!-- Start dot (Home) -->
  <circle cx="80" cy="290" r="9" fill="#777777" stroke="#555555" stroke-width="2"/>
  <text x="80" y="315" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Home</text>

  <!-- End dot (Soccer Fields) with arrival marker -->
  <circle cx="310" cy="150" r="9" fill="#555555" stroke="#333333" stroke-width="2"/>
  <circle cx="310" cy="150" r="15" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="310" y="138" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Soccer Fields</text>

  <!-- Completion Card -->
  <rect x="15" y="378" width="345" height="175" rx="12" ry="12" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Arrived at -->
  <text x="30" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Arrived at</text>
  <text x="30" y="434" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Soccer Fields</text>

  <!-- Divider -->
  <line x1="30" y1="448" x2="345" y2="448" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Trip Duration -->
  <text x="30" y="475" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#888888">Trip Duration</text>
  <text x="250" y="475" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold" text-anchor="end">18 min</text>

  <!-- Divider -->
  <line x1="30" y1="490" x2="345" y2="490" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Shared with -->
  <text x="30" y="517" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#888888">Shared with</text>
  <text x="250" y="517" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" text-anchor="end">Grandma Rosa</text>
  <!-- Checkmark for shared -->
  <circle cx="268" cy="512" r="10" fill="#666666"/>
  <path d="M 262 512 L 266 517 L 275 507" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Divider -->
  <line x1="30" y1="535" x2="345" y2="535" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Star Rating Section -->
  <rect x="15" y="570" width="345" height="95" rx="12" ry="12" fill="#F0F0F0" stroke="#DDDDDD" stroke-width="1"/>
  <text x="187" y="598" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle">Rate your trip</text>

  <!-- 5 Star outlines -->
  <!-- Star 1 -->
  <polygon points="107,625 111,616 115,625 125,627 118,633 120,643 111,638 102,643 104,633 97,627" fill="none" stroke="#999999" stroke-width="1.5"/>
  <!-- Star 2 -->
  <polygon points="147,625 151,616 155,625 165,627 158,633 160,643 151,638 142,643 144,633 137,627" fill="none" stroke="#999999" stroke-width="1.5"/>
  <!-- Star 3 -->
  <polygon points="187,625 191,616 195,625 205,627 198,633 200,643 191,638 182,643 184,633 177,627" fill="none" stroke="#999999" stroke-width="1.5"/>
  <!-- Star 4 -->
  <polygon points="227,625 231,616 235,625 245,627 238,633 240,643 231,638 222,643 224,633 217,627" fill="none" stroke="#999999" stroke-width="1.5"/>
  <!-- Star 5 -->
  <polygon points="267,625 271,616 275,625 285,627 278,633 280,643 271,638 262,643 264,633 257,627" fill="none" stroke="#999999" stroke-width="1.5"/>

  <!-- Bottom Buttons -->
  <rect x="20" y="690" width="165" height="50" rx="12" ry="12" fill="#333333"/>
  <text x="102" y="720" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Rate Driver</text>

  <rect x="195" y="690" width="165" height="50" rx="12" ry="12" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="277" y="720" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Done</text>

  <!-- Home Indicator -->
  <rect x="140" y="788" width="95" height="5" rx="3" ry="3" fill="#CCCCCC"/>
</svg>
