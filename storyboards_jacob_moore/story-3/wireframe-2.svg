<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="1" y="1" width="373" height="810" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">9:41</text>
  <text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">LTE</text>
  <!-- Battery icon -->
  <rect x="330" y="18" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="352" y="21" width="3" height="5" rx="1" ry="1" fill="#333333"/>
  <rect x="332" y="20" width="16" height="7" rx="1" ry="1" fill="#333333"/>

  <!-- Title Bar with Back Arrow -->
  <rect x="0" y="44" width="375" height="50" fill="#F5F5F5"/>
  <!-- Back arrow -->
  <path d="M 25 69 L 15 69 L 25 59" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 25 69 L 15 69 L 25 79" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="75" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Share Your Trip</text>

  <!-- Section Header: Trusted Contacts -->
  <rect x="0" y="108" width="375" height="36" fill="#F0F0F0"/>
  <text x="25" y="131" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888" font-weight="bold">TRUSTED CONTACTS</text>

  <!-- Contact 1: Grandma Rosa (selected) -->
  <rect x="0" y="148" width="375" height="80" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Selected highlight -->
  <rect x="5" y="152" width="365" height="72" rx="10" ry="10" fill="#EEEEEE" stroke="#AAAAAA" stroke-width="1"/>
  <!-- Avatar -->
  <circle cx="45" cy="188" r="24" fill="#CCCCCC" stroke="#AAAAAA" stroke-width="1"/>
  <text x="45" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#777777" text-anchor="middle">GR</text>
  <!-- Name and relationship -->
  <text x="82" y="180" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="bold">Grandma Rosa</text>
  <text x="82" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Mom</text>
  <!-- Checkmark -->
  <circle cx="340" cy="188" r="16" fill="#555555"/>
  <path d="M 330 188 L 337 196 L 351 180" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Contact 2: Uncle David (unselected) -->
  <rect x="0" y="232" width="375" height="80" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Avatar -->
  <circle cx="45" cy="272" r="24" fill="#DDDDDD" stroke="#BBBBBB" stroke-width="1"/>
  <text x="45" y="276" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#999999" text-anchor="middle">UD</text>
  <!-- Name and relationship -->
  <text x="82" y="264" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333">Uncle David</text>
  <text x="82" y="284" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Uncle</text>
  <!-- Empty circle (unselected) -->
  <circle cx="340" cy="272" r="16" fill="none" stroke="#CCCCCC" stroke-width="2"/>

  <!-- Add Contact Button -->
  <rect x="15" y="328" width="345" height="50" rx="10" ry="10" fill="none" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="187" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#888888" text-anchor="middle">+ Add Contact</text>

  <!-- Divider -->
  <line x1="15" y1="400" x2="360" y2="400" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Share Via Section -->
  <text x="25" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888" font-weight="bold">SHARE VIA</text>

  <!-- SMS Button -->
  <rect x="30" y="450" width="90" height="70" rx="12" ry="12" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="57" y="462" width="36" height="28" rx="6" ry="6" fill="#CCCCCC"/>
  <text x="75" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#777777" text-anchor="middle">SMS</text>
  <text x="75" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">SMS</text>

  <!-- WhatsApp Button -->
  <rect x="142" y="450" width="90" height="70" rx="12" ry="12" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="187" cy="476" r="14" fill="#CCCCCC"/>
  <text x="187" y="480" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#777777" text-anchor="middle">WA</text>
  <text x="187" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">WhatsApp</text>

  <!-- Link Button -->
  <rect x="254" y="450" width="90" height="70" rx="12" ry="12" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Link icon placeholder -->
  <circle cx="299" cy="472" r="8" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <circle cx="299" cy="482" r="8" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <text x="299" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">Link</text>

  <!-- Divider -->
  <line x1="15" y1="545" x2="360" y2="545" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Preview text -->
  <text x="187" y="575" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888" text-anchor="middle">Rosa will receive a live tracking link</text>

  <!-- Share with Rosa Button (prominent CTA) -->
  <rect x="25" y="600" width="325" height="56" rx="14" ry="14" fill="#333333"/>
  <text x="187" y="634" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Share with Rosa</text>

  <!-- Home Indicator -->
  <rect x="140" y="788" width="95" height="5" rx="3" ry="3" fill="#CCCCCC"/>
</svg>
