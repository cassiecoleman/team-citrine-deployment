<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="1" y="1" width="373" height="810" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">9:41</text>
  <text x="300" y="28" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333">LTE</text>
  <!-- Battery icon -->
  <rect x="330" y="18" width="22" height="11" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="352" y="21" width="3" height="5" rx="1" ry="1" fill="#333333"/>
  <rect x="332" y="20" width="16" height="7" rx="1" ry="1" fill="#333333"/>

  <!-- Title Bar with Logo -->
  <rect x="0" y="44" width="375" height="50" fill="#F5F5F5"/>
  <text x="30" y="75" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold">Live Trip Tracking</text>
  <!-- RideShare logo placeholder -->
  <rect x="315" y="56" width="40" height="26" rx="6" ry="6" fill="#DDDDDD" stroke="#AAAAAA" stroke-width="1"/>
  <text x="335" y="73" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#777777" text-anchor="middle">RS</text>

  <!-- Live indicator -->
  <circle cx="22" y="56" r="4" fill="#888888"/>
  <circle cx="280" cy="69" r="5" fill="#666666"/>
  <text x="290" y="73" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">LIVE</text>

  <!-- Map Area -->
  <rect x="15" y="110" width="345" height="320" rx="12" ry="12" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Map grid lines for texture -->
  <line x1="15" y1="175" x2="360" y2="175" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="240" x2="360" y2="240" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="305" x2="360" y2="305" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="15" y1="370" x2="360" y2="370" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="100" y1="110" x2="100" y2="430" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="190" y1="110" x2="190" y2="430" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="280" y1="110" x2="280" y2="430" stroke="#DDDDDD" stroke-width="0.5"/>

  <!-- Route path -->
  <path d="M 70 340 C 110 300, 150 220, 195 230 C 240 240, 270 190, 320 175" stroke="#666666" stroke-width="3" stroke-dasharray="8,5" fill="none"/>
  <!-- Completed portion of route (solid) -->
  <path d="M 70 340 C 110 300, 150 220, 195 230 C 220 236, 235 220, 250 210" stroke="#555555" stroke-width="3" fill="none"/>

  <!-- Start dot (Home) -->
  <circle cx="70" cy="340" r="8" fill="#555555" stroke="#333333" stroke-width="2"/>
  <text x="70" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Home</text>

  <!-- End dot (Soccer Fields) -->
  <circle cx="320" cy="175" r="8" fill="#888888" stroke="#333333" stroke-width="2"/>
  <text x="320" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Soccer Fields</text>

  <!-- Car icon (current position) -->
  <rect x="235" y="200" width="34" height="22" rx="5" ry="5" fill="#444444" stroke="#333333" stroke-width="1"/>
  <text x="252" y="215" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">CAR</text>
  <!-- Pulsing dot around car -->
  <circle cx="252" cy="211" r="20" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Info Card -->
  <rect x="15" y="445" width="345" height="175" rx="12" ry="12" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Card Header -->
  <text x="30" y="475" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">Maria's Trip</text>
  <!-- Divider -->
  <line x1="30" y1="488" x2="345" y2="488" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Driver info -->
  <text x="30" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Driver</text>
  <text x="100" y="512" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">James R. — Toyota Highlander</text>

  <!-- ETA -->
  <text x="30" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">ETA</text>
  <text x="100" y="540" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">3:45 PM</text>
  <text x="170" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">(8 min remaining)</text>

  <!-- Route -->
  <text x="30" y="568" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Route</text>
  <text x="100" y="568" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Home</text>
  <text x="145" y="568" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#AAAAAA">&#8594;</text>
  <text x="165" y="568" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Soccer Fields</text>

  <!-- Progress bar -->
  <rect x="30" y="585" width="315" height="6" rx="3" ry="3" fill="#E0E0E0"/>
  <rect x="30" y="585" width="210" height="6" rx="3" ry="3" fill="#777777"/>
  <text x="30" y="608" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888888">67% of trip completed</text>

  <!-- Bottom Buttons -->
  <rect x="20" y="645" width="165" height="50" rx="12" ry="12" fill="#333333"/>
  <text x="102" y="675" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Call Maria</text>

  <rect x="195" y="645" width="165" height="50" rx="12" ry="12" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="277" y="675" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Call Driver</text>

  <!-- Home Indicator -->
  <rect x="140" y="788" width="95" height="5" rx="3" ry="3" fill="#CCCCCC"/>
</svg>
