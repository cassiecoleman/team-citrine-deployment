<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <!-- Battery Icon -->
  <rect x="315" y="20" width="24" height="12" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="339" y="24" width="3" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="317" y="22" width="18" height="8" rx="1" ry="1" fill="#333"/>
  <!-- Signal Bars -->
  <rect x="280" y="27" width="3" height="5" fill="#333"/>
  <rect x="285" y="25" width="3" height="7" fill="#333"/>
  <rect x="290" y="22" width="3" height="10" fill="#333"/>
  <rect x="295" y="19" width="3" height="13" fill="#333"/>

  <!-- Navigation Bar with Back Arrow -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Back Arrow -->
  <path d="M28 72 L16 72 L24 64" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 72 L24 80" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Title -->
  <text x="187" y="78" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold" text-anchor="middle">Review Schedule</text>

  <!-- Summary Card -->
  <rect x="16" y="120" width="343" height="320" rx="16" ry="16" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Route Section -->
  <text x="36" y="156" font-family="Arial, sans-serif" font-size="13" fill="#999" font-weight="bold">ROUTE</text>
  <!-- Home icon -->
  <path d="M36 170 L48 162 L60 170 L60 184 L36 184 Z" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="15" fill="#333">Home</text>
  <!-- Arrow -->
  <line x1="120" y1="176" x2="150" y2="176" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M146 172 L154 176 L146 180" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- School icon -->
  <rect x="164" y="170" width="16" height="14" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M160 170 L172 163 L184 170" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="192" y="180" font-family="Arial, sans-serif" font-size="15" fill="#333">Lincoln Elementary</text>

  <!-- Divider inside card -->
  <line x1="36" y1="200" x2="339" y2="200" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Days Section -->
  <text x="36" y="232" font-family="Arial, sans-serif" font-size="13" fill="#999" font-weight="bold">DAYS</text>
  <text x="36" y="260" font-family="Arial, sans-serif" font-size="16" fill="#333">Monday - Friday</text>
  <!-- Small day indicators -->
  <circle cx="240" cy="254" r="10" fill="#333"/>
  <text x="240" y="258" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">M</text>
  <circle cx="264" cy="254" r="10" fill="#333"/>
  <text x="264" y="258" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">T</text>
  <circle cx="288" cy="254" r="10" fill="#333"/>
  <text x="288" y="258" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">W</text>
  <circle cx="312" cy="254" r="10" fill="#333"/>
  <text x="312" y="258" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">T</text>
  <circle cx="336" cy="254" r="10" fill="#333"/>
  <text x="336" y="258" font-family="Arial, sans-serif" font-size="9" fill="#fff" text-anchor="middle">F</text>

  <!-- Divider inside card -->
  <line x1="36" y1="280" x2="339" y2="280" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Time Section -->
  <text x="36" y="312" font-family="Arial, sans-serif" font-size="13" fill="#999" font-weight="bold">PICKUP TIME</text>
  <!-- Clock icon -->
  <circle cx="48" cy="340" r="12" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="48" y1="333" x2="48" y2="340" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="340" x2="54" y2="340" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <text x="70" y="346" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">7:30 AM</text>

  <!-- Divider inside card -->
  <line x1="36" y1="366" x2="339" y2="366" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Estimated Fare Section -->
  <text x="36" y="396" font-family="Arial, sans-serif" font-size="13" fill="#999" font-weight="bold">ESTIMATED FARE</text>
  <text x="36" y="426" font-family="Arial, sans-serif" font-size="22" fill="#333" font-weight="bold">~$12</text>
  <text x="96" y="426" font-family="Arial, sans-serif" font-size="14" fill="#999">/trip</text>

  <!-- Child Seat Toggle -->
  <rect x="16" y="464" width="343" height="60" rx="12" ry="12" fill="#fff"/>
  <line x1="16" y1="524" x2="359" y2="524" stroke="#e0e0e0" stroke-width="1"/>
  <text x="24" y="500" font-family="Arial, sans-serif" font-size="16" fill="#333">Child Seat Required</text>
  <!-- Toggle Switch (ON) -->
  <rect x="290" y="480" width="52" height="30" rx="15" ry="15" fill="#333"/>
  <circle cx="327" cy="495" r="12" fill="#fff"/>

  <!-- Preferred Drivers Toggle -->
  <rect x="16" y="530" width="343" height="60" rx="12" ry="12" fill="#fff"/>
  <text x="24" y="566" font-family="Arial, sans-serif" font-size="16" fill="#333">Preferred Drivers Only</text>
  <!-- Toggle Switch (OFF) -->
  <rect x="290" y="546" width="52" height="30" rx="15" ry="15" fill="#e0e0e0"/>
  <circle cx="305" cy="561" r="12" fill="#fff"/>

  <!-- Confirm Schedule Button -->
  <rect x="16" y="660" width="343" height="56" rx="28" ry="28" fill="#333"/>
  <text x="187" y="694" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">Confirm Schedule</text>

  <!-- Bottom Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
