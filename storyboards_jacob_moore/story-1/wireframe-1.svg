<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="375" height="44" rx="30" ry="30" fill="#f5f5f5"/>
  <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">9:41</text>
  <!-- Battery Icon -->
  <rect x="315" y="20" width="24" height="12" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="339" y="24" width="3" height="5" rx="1" ry="1" fill="#333"/>
  <rect x="317" y="22" width="18" height="8" rx="1" ry="1" fill="#333"/>
  <!-- Signal Bars -->
  <rect x="280" y="27" width="3" height="5" fill="#333"/>
  <rect x="285" y="25" width="3" height="7" fill="#333"/>
  <rect x="290" y="22" width="3" height="10" fill="#333"/>
  <rect x="295" y="19" width="3" height="13" fill="#333"/>

  <!-- Navigation Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#fff"/>
  <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Hamburger Menu -->
  <line x1="20" y1="64" x2="44" y2="64" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="72" x2="44" y2="72" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="44" y2="80" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- App Title -->
  <text x="130" y="78" font-family="Arial, sans-serif" font-size="20" fill="#333" font-weight="bold" text-anchor="middle">RideShare</text>
  <!-- Notification Bell -->
  <circle cx="345" cy="68" r="8" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="345" y1="60" x2="345" y2="56" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M339 74 C339 74 345 80 351 74" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="345" cy="63" r="1.5" fill="#333"/>

  <!-- Map Area -->
  <rect x="16" y="116" width="343" height="380" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Map Grid Lines (subtle) -->
  <line x1="100" y1="116" x2="100" y2="496" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="200" y1="116" x2="200" y2="496" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="300" y1="116" x2="300" y2="496" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="16" y1="200" x2="359" y2="200" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="16" y1="300" x2="359" y2="300" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="16" y1="400" x2="359" y2="400" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Map Street Lines -->
  <line x1="60" y1="250" x2="320" y2="250" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="60" y1="350" x2="320" y2="350" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="150" y1="150" x2="150" y2="470" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="250" y1="150" x2="250" y2="470" stroke="#e0e0e0" stroke-width="3"/>
  <!-- MAP Label -->
  <text x="187" y="280" font-family="Arial, sans-serif" font-size="24" fill="#999" text-anchor="middle" font-weight="bold">MAP</text>
  <!-- Location Pin -->
  <path d="M187 310 C187 310 175 330 187 340 C199 330 187 310 187 310Z" fill="#333"/>
  <circle cx="187" cy="320" r="5" fill="#fff"/>

  <!-- Where to? Search Bar -->
  <rect x="16" y="516" width="343" height="56" rx="28" ry="28" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Search Icon -->
  <circle cx="48" cy="544" r="10" fill="none" stroke="#999" stroke-width="2"/>
  <line x1="55" y1="551" x2="62" y2="558" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <text x="76" y="549" font-family="Arial, sans-serif" font-size="16" fill="#999">Where to?</text>

  <!-- Spacer -->
  <rect x="0" y="596" width="375" height="20" fill="#fff"/>

  <!-- Action Buttons Row -->
  <rect x="16" y="616" width="105" height="80" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="135" y="616" width="105" height="80" rx="12" ry="12" fill="#333" stroke="#333" stroke-width="1"/>
  <rect x="254" y="616" width="105" height="80" rx="12" ry="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Ride Now Button -->
  <!-- Car icon -->
  <rect x="52" y="636" width="26" height="12" rx="4" ry="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="56" cy="652" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="74" cy="652" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="68" y="678" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Ride Now</text>

  <!-- Schedule Button (highlighted) -->
  <!-- Calendar icon -->
  <rect x="172" y="634" width="20" height="18" rx="2" ry="2" fill="none" stroke="#fff" stroke-width="1.5"/>
  <line x1="172" y1="640" x2="192" y2="640" stroke="#fff" stroke-width="1.5"/>
  <line x1="178" y1="631" x2="178" y2="636" stroke="#fff" stroke-width="1.5"/>
  <line x1="186" y1="631" x2="186" y2="636" stroke="#fff" stroke-width="1.5"/>
  <text x="187" y="678" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Schedule</text>

  <!-- History Button -->
  <!-- Clock icon -->
  <circle cx="306" cy="644" r="10" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="306" y1="638" x2="306" y2="644" stroke="#333" stroke-width="1.5"/>
  <line x1="306" y1="644" x2="312" y2="644" stroke="#333" stroke-width="1.5"/>
  <text x="306" y="678" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">History</text>

  <!-- Bottom Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" ry="2.5" fill="#333"/>
</svg>
