<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41</text>
  <text x="310" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">LTE</text>
  <rect x="270" y="22" width="18" height="10" rx="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="272" y="24" width="12" height="6" rx="1" fill="#333333"/>
  <rect x="288" y="25" width="2" height="4" rx="1" fill="#333333"/>
  <line x1="30" y1="44" x2="345" y2="44" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="187" y="80" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#333333" font-weight="bold" text-anchor="middle">Ride Confirmed</text>

  <!-- Checkmark -->
  <circle cx="310" cy="72" r="12" fill="#4CAF50" opacity="0.15"/>
  <polyline points="304,72 309,77 318,67" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Map Area -->
  <rect x="20" y="100" width="335" height="220" rx="12" fill="#EEEEEE" stroke="#DDDDDD" stroke-width="1"/>
  <!-- Map grid -->
  <line x1="20" y1="150" x2="355" y2="150" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="20" y1="200" x2="355" y2="200" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="20" y1="250" x2="355" y2="250" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="110" y1="100" x2="110" y2="320" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="200" y1="100" x2="200" y2="320" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="290" y1="100" x2="290" y2="320" stroke="#E5E5E5" stroke-width="0.5"/>
  <!-- Route line -->
  <path d="M80,260 C130,260 150,190 200,190 C250,190 270,170 310,170" fill="none" stroke="#555555" stroke-width="3" stroke-linecap="round"/>
  <!-- Start pin (A) -->
  <circle cx="80" cy="260" r="9" fill="#333333"/>
  <circle cx="80" cy="260" r="4" fill="#FFFFFF"/>
  <!-- End pin (B) -->
  <circle cx="310" cy="170" r="9" fill="#333333"/>
  <text x="310" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text>

  <!-- Car icon on route (driver location) -->
  <rect x="152" y="210" width="20" height="12" rx="3" fill="#666666"/>
  <rect x="155" y="205" width="14" height="7" rx="2" fill="#666666"/>
  <circle cx="156" cy="224" r="3" fill="#666666"/>
  <circle cx="168" cy="224" r="3" fill="#666666"/>

  <!-- Trusted Driver Badge -->
  <rect x="20" y="338" width="335" height="40" rx="20" fill="#F5F5F0" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="50,352 53,358 60,358 55,362 57,368 50,364 43,368 45,362 40,358 47,358" fill="#D4AF37"/>
  <text x="72" y="363" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8B7500" font-weight="bold">Trusted Driver</text>
  <polygon points="210,352 213,358 220,358 215,362 217,368 210,364 203,368 205,362 200,358 207,358" fill="#D4AF37"/>

  <!-- Driver Card -->
  <rect x="20" y="392" width="335" height="180" rx="14" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>

  <!-- Driver Avatar -->
  <circle cx="72" cy="440" r="32" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="2"/>
  <circle cx="72" cy="430" r="12" fill="#AAAAAA"/>
  <ellipse cx="72" cy="454" rx="16" ry="10" fill="#AAAAAA"/>
  <!-- Trusted badge on avatar -->
  <circle cx="96" cy="416" r="10" fill="#D4AF37" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="96,411 97,414 101,414 98,416 99,420 96,418 93,420 94,416 91,414 95,414" fill="#FFFFFF"/>

  <!-- Driver Info -->
  <text x="120" y="430" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333" font-weight="bold">James R.</text>
  <text x="120" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777">4.9</text>
  <polygon points="143,443 146,449 152,449 147,453 149,459 143,455 137,459 139,453 134,449 140,449" fill="#FFD700" stroke="#E0C200" stroke-width="0.5"/>

  <!-- Divider in card -->
  <line x1="40" y1="468" x2="335" y2="468" stroke="#E8E8E8" stroke-width="1"/>

  <!-- Vehicle Info -->
  <rect x="40" y="478" width="20" height="12" rx="3" fill="#BBBBBB"/>
  <text x="70" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Toyota Highlander -- White</text>

  <!-- Rides together -->
  <path d="M52,515 C52,515 44,509 44,505 C44,502 46,500 49,500 C51,500 52,501 52,503 C52,501 53,500 55,500 C58,500 60,502 60,505 C60,509 52,515 52,515 Z" fill="#999999"/>
  <text x="70" y="514" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Your trusted driver -- 3 rides together</text>

  <!-- ETA -->
  <rect x="20" y="590" width="335" height="50" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="50" y="621" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#333333" font-weight="bold">5</text>
  <text x="72" y="614" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777">min</text>
  <text x="72" y="630" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777">away</text>
  <!-- Vertical divider -->
  <line x1="110" y1="600" x2="110" y2="630" stroke="#E0E0E0" stroke-width="1"/>
  <text x="130" y="620" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777">Arriving at pickup</text>

  <!-- Action Buttons -->
  <rect x="20" y="660" width="165" height="52" rx="12" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1.5"/>
  <!-- Phone icon -->
  <rect x="55" y="680" width="12" height="16" rx="2" fill="#555555"/>
  <text x="76" y="692" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" font-weight="600">Contact James</text>

  <rect x="195" y="660" width="160" height="52" rx="12" fill="#333333"/>
  <!-- Share icon -->
  <circle cx="225" cy="686" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="225" y1="678" x2="225" y2="688" stroke="#FFFFFF" stroke-width="1.5"/>
  <polyline points="220,683 225,678 230,683" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="692" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">Share Trip</text>

  <!-- Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" fill="#CCCCCC"/>
</svg>
