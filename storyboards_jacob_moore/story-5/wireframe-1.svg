<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41</text>
  <text x="310" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">LTE</text>
  <!-- Status bar icons -->
  <rect x="270" y="22" width="18" height="10" rx="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="272" y="24" width="12" height="6" rx="1" fill="#333333"/>
  <rect x="288" y="25" width="2" height="4" rx="1" fill="#333333"/>
  <line x1="30" y1="44" x2="345" y2="44" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title -->
  <text x="187" y="80" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#333333" font-weight="bold" text-anchor="middle">Rate Your Trip</text>

  <!-- Trip Summary -->
  <rect x="30" y="100" width="315" height="44" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="50" cy="122" r="6" fill="#555555"/>
  <text x="66" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Home</text>
  <line x1="110" y1="122" x2="150" y2="122" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="158" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#999999">--></text>
  <circle cx="188" cy="122" r="6" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="204" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Soccer Fields</text>

  <!-- Driver Avatar -->
  <circle cx="187" cy="200" r="40" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="2"/>
  <circle cx="187" cy="190" r="14" fill="#AAAAAA"/>
  <ellipse cx="187" cy="218" rx="20" ry="12" fill="#AAAAAA"/>

  <!-- Driver Name -->
  <text x="187" y="265" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold" text-anchor="middle">James R.</text>

  <!-- Driver Rating -->
  <text x="187" y="288" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777" text-anchor="middle">4.9</text>
  <polygon points="210,280 213,287 220,287 214,292 216,299 210,295 204,299 206,292 200,287 207,287" fill="#FFD700" stroke="#E0C200" stroke-width="0.5"/>

  <!-- Five Star Rating (all filled) -->
  <text x="187" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#999999" text-anchor="middle">Your Rating</text>

  <!-- Star 1 -->
  <polygon points="108,355 114,370 130,370 117,380 122,395 108,386 94,395 99,380 86,370 102,370" fill="#FFD700" stroke="#E0C200" stroke-width="1"/>
  <!-- Star 2 -->
  <polygon points="148,355 154,370 170,370 157,380 162,395 148,386 134,395 139,380 126,370 142,370" fill="#FFD700" stroke="#E0C200" stroke-width="1"/>
  <!-- Star 3 -->
  <polygon points="188,355 194,370 210,370 197,380 202,395 188,386 174,395 179,380 166,370 182,370" fill="#FFD700" stroke="#E0C200" stroke-width="1"/>
  <!-- Star 4 -->
  <polygon points="228,355 234,370 250,370 237,380 242,395 228,386 214,395 219,380 206,370 222,370" fill="#FFD700" stroke="#E0C200" stroke-width="1"/>
  <!-- Star 5 -->
  <polygon points="268,355 274,370 290,370 277,380 282,395 268,386 254,395 259,380 246,370 262,370" fill="#FFD700" stroke="#E0C200" stroke-width="1"/>

  <!-- Divider -->
  <line x1="50" y1="415" x2="325" y2="415" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Heart Icon and Trusted Drivers -->
  <circle cx="187" cy="460" r="28" fill="#FFF0F0" stroke="#E0E0E0" stroke-width="1"/>
  <path d="M187,472 C187,472 173,462 173,454 C173,449 177,446 181,446 C184,446 186,448 187,450 C188,448 190,446 193,446 C197,446 201,449 201,454 C201,462 187,472 187,472 Z" fill="#EE5555" stroke="#DD4444" stroke-width="0.5"/>
  <text x="187" y="504" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555" text-anchor="middle" font-weight="600">Add to Trusted Drivers</text>

  <!-- Tap indicator -->
  <circle cx="187" cy="460" r="34" fill="none" stroke="#EE5555" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Divider -->
  <line x1="50" y1="530" x2="325" y2="530" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Tip Section -->
  <text x="40" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="600">Add a Tip</text>

  <!-- Tip buttons -->
  <rect x="40" y="570" width="70" height="40" rx="8" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
  <text x="75" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="500">$2</text>

  <rect x="120" y="570" width="70" height="40" rx="8" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
  <text x="155" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="500">$5</text>

  <rect x="200" y="570" width="70" height="40" rx="8" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
  <text x="235" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="500">$10</text>

  <rect x="280" y="570" width="70" height="40" rx="8" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
  <text x="315" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="500">Custom</text>

  <!-- Submit Button -->
  <rect x="30" y="645" width="315" height="52" rx="12" fill="#333333"/>
  <text x="187" y="677" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Submit Rating</text>

  <!-- Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" fill="#CCCCCC"/>
</svg>
