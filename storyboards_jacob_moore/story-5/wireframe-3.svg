<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41</text>
  <text x="310" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">LTE</text>
  <rect x="270" y="22" width="18" height="10" rx="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="272" y="24" width="12" height="6" rx="1" fill="#333333"/>
  <rect x="288" y="25" width="2" height="4" rx="1" fill="#333333"/>
  <line x1="30" y1="44" x2="345" y2="44" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Back Arrow and Title -->
  <text x="30" y="78" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#333333" font-weight="300">&lt;</text>
  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333" font-weight="bold">Choose a Ride</text>

  <!-- Mini Map -->
  <rect x="20" y="98" width="335" height="160" rx="12" fill="#EEEEEE" stroke="#DDDDDD" stroke-width="1"/>
  <!-- Map grid lines -->
  <line x1="20" y1="140" x2="355" y2="140" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="20" y1="180" x2="355" y2="180" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="20" y1="220" x2="355" y2="220" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="100" y1="98" x2="100" y2="258" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="190" y1="98" x2="190" y2="258" stroke="#E5E5E5" stroke-width="0.5"/>
  <line x1="280" y1="98" x2="280" y2="258" stroke="#E5E5E5" stroke-width="0.5"/>
  <!-- Route line -->
  <path d="M80,200 C120,200 140,155 190,155 C240,155 260,180 300,160" fill="none" stroke="#555555" stroke-width="3" stroke-linecap="round"/>
  <!-- Start pin -->
  <circle cx="80" cy="200" r="8" fill="#333333"/>
  <circle cx="80" cy="200" r="4" fill="#FFFFFF"/>
  <!-- End pin -->
  <circle cx="300" cy="160" r="8" fill="#333333"/>
  <text x="300" y="164" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text>

  <!-- Ride Option: Standard -->
  <rect x="20" y="274" width="335" height="60" rx="10" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
  <rect x="35" y="290" width="28" height="18" rx="4" fill="#CCCCCC"/>
  <text x="80" y="302" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="600">Standard</text>
  <text x="80" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#999999">4 min away</text>
  <text x="310" y="308" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="600" text-anchor="end">$12.50</text>

  <!-- Ride Option: Child-Safe (Selected) -->
  <rect x="20" y="344" width="335" height="60" rx="10" fill="#F5F5F5" stroke="#555555" stroke-width="2"/>
  <rect x="35" y="360" width="28" height="18" rx="4" fill="#999999"/>
  <circle cx="49" cy="357" r="4" fill="#999999"/>
  <text x="80" y="372" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="700">Child-Safe</text>
  <text x="80" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#999999">Car seat included</text>
  <text x="310" y="378" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="600" text-anchor="end">$15.00</text>
  <!-- Checkmark -->
  <circle cx="330" y="370" r="10" fill="#555555"/>
  <polyline points="324,370 329,375 336,365" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ride Option: XL -->
  <rect x="20" y="414" width="335" height="60" rx="10" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
  <rect x="35" y="430" width="32" height="20" rx="4" fill="#CCCCCC"/>
  <text x="80" y="442" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="600">XL</text>
  <text x="80" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#999999">6 seats</text>
  <text x="310" y="448" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" font-weight="600" text-anchor="end">$18.00</text>

  <!-- Divider -->
  <line x1="30" y1="492" x2="345" y2="492" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Preferred Drivers Toggle -->
  <rect x="20" y="506" width="335" height="56" rx="10" fill="#F8F8F8" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Heart icon -->
  <path d="M46,530 C46,530 38,524 38,520 C38,517 40,515 43,515 C45,515 46,516 46,518 C46,516 47,515 49,515 C52,515 54,517 54,520 C54,524 46,530 46,530 Z" fill="#777777"/>
  <text x="66" y="536" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="600">Preferred Drivers</text>

  <!-- Toggle Switch (ON) -->
  <rect x="280" y="520" width="52" height="28" rx="14" fill="#555555"/>
  <circle cx="318" cy="534" r="12" fill="#FFFFFF"/>

  <!-- Searching Status -->
  <!-- Loading spinner -->
  <circle cx="60" cy="590" r="10" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="15,15" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 60 590" to="360 60 590" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="595" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777777" font-style="italic">Searching trusted drivers first...</text>

  <!-- Request Ride Button (Grayed Out) -->
  <rect x="30" y="640" width="315" height="52" rx="12" fill="#CCCCCC"/>
  <text x="187" y="672" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Request Ride</text>

  <!-- Three dots loading -->
  <circle cx="172" cy="710" r="4" fill="#CCCCCC" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="188" cy="710" r="4" fill="#CCCCCC" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="204" cy="710" r="4" fill="#CCCCCC" opacity="1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" fill="#CCCCCC"/>
</svg>
