<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41</text>
  <text x="310" y="32" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">LTE</text>
  <rect x="270" y="22" width="18" height="10" rx="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="272" y="24" width="12" height="6" rx="1" fill="#333333"/>
  <rect x="288" y="25" width="2" height="4" rx="1" fill="#333333"/>
  <line x1="30" y1="44" x2="345" y2="44" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Title with Heart -->
  <text x="187" y="82" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333" font-weight="bold" text-anchor="middle">Trusted Driver Added</text>
  <path d="M310,70 C310,70 300,63 300,58 C300,54 303,52 306,52 C308,52 309,53 310,55 C311,53 312,52 314,52 C317,52 320,54 320,58 C320,63 310,70 310,70 Z" fill="#EE5555"/>

  <!-- Checkmark circle -->
  <circle cx="187" cy="125" r="24" fill="#4CAF50" opacity="0.15"/>
  <circle cx="187" cy="125" r="24" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <polyline points="176,125 184,133 198,118" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Profile Card -->
  <rect x="30" y="168" width="315" height="380" rx="16" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>

  <!-- Driver Avatar (large) -->
  <circle cx="187" cy="230" r="48" fill="#E0E0E0" stroke="#CCCCCC" stroke-width="2"/>
  <circle cx="187" cy="218" r="16" fill="#AAAAAA"/>
  <ellipse cx="187" cy="250" rx="24" ry="14" fill="#AAAAAA"/>

  <!-- Driver Name -->
  <text x="187" y="305" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#333333" font-weight="bold" text-anchor="middle">James R.</text>

  <!-- Rating and Trips -->
  <text x="187" y="332" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#777777" text-anchor="middle">4.9</text>
  <polygon points="207,323 210,329 216,329 211,333 213,339 207,335 201,339 203,333 198,329 204,329" fill="#FFD700" stroke="#E0C200" stroke-width="0.5"/>
  <text x="230" y="332" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#777777">--</text>
  <text x="250" y="332" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#777777">312 trips</text>

  <!-- Divider -->
  <line x1="55" y1="350" x2="320" y2="350" stroke="#E8E8E8" stroke-width="1"/>

  <!-- Vehicle Info -->
  <rect x="55" y="362" width="265" height="40" rx="8" fill="#F0F0F0"/>
  <!-- Car icon -->
  <rect x="70" y="374" width="24" height="12" rx="3" fill="#999999"/>
  <rect x="74" y="368" width="16" height="8" rx="2" fill="#999999"/>
  <circle cx="76" cy="388" r="4" fill="#999999"/>
  <circle cx="90" cy="388" r="4" fill="#999999"/>
  <text x="106" y="387" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Toyota Highlander -- White</text>

  <!-- Rides Together -->
  <rect x="55" y="414" width="265" height="40" rx="8" fill="#F0F0F0"/>
  <text x="75" y="440" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#333333" font-weight="bold">3</text>
  <text x="100" y="439" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Rides with you</text>

  <!-- Personal Note Field -->
  <text x="55" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="500">PERSONAL NOTE</text>
  <rect x="55" y="492" width="265" height="44" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="70" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">Great with kids</text>
  <!-- Pencil icon -->
  <line x1="300" y1="508" x2="308" y2="500" stroke="#999999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="308" y1="500" x2="312" y2="504" stroke="#999999" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Buttons -->
  <rect x="30" y="580" width="200" height="50" rx="12" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="130" y="611" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555" text-anchor="middle" font-weight="600">View All Trusted Drivers</text>

  <rect x="240" y="580" width="105" height="50" rx="12" fill="#333333"/>
  <text x="292" y="611" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Done</text>

  <!-- Home Indicator -->
  <rect x="140" y="790" width="95" height="5" rx="2.5" fill="#CCCCCC"/>
</svg>
