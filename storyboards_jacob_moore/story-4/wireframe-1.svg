<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41 AM</text>
  <text x="310" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">100%</text>
  <!-- Battery icon -->
  <rect x="340" y="18" width="22" height="12" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="362" y="22" width="3" height="4" rx="1" fill="#333333"/>
  <rect x="342" y="20" width="16" height="8" rx="1" fill="#333333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#F5F5F5"/>
  <!-- Hamburger Menu -->
  <line x1="20" y1="64" x2="40" y2="64" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="72" x2="40" y2="72" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="80" x2="40" y2="80" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- App Title -->
  <text x="187" y="78" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333" font-weight="bold" text-anchor="middle">RideShare</text>
  <!-- Notification Bell -->
  <circle cx="348" cy="72" r="10" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M343 72 L348 65 L353 72" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="348" cy="76" r="1.5" fill="#333333"/>

  <!-- Map Area -->
  <rect x="16" y="116" width="343" height="280" rx="12" fill="#E8E8E8" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Map placeholder content -->
  <text x="187" y="230" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#999999" text-anchor="middle">Map View</text>
  <!-- Map grid lines for visual texture -->
  <line x1="60" y1="140" x2="60" y2="370" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="140" y1="140" x2="140" y2="370" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="220" y1="140" x2="220" y2="370" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="300" y1="140" x2="300" y2="370" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="30" y1="180" x2="345" y2="180" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="30" y1="230" x2="345" y2="230" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="30" y1="280" x2="345" y2="280" stroke="#DDDDDD" stroke-width="0.5"/>
  <line x1="30" y1="330" x2="345" y2="330" stroke="#DDDDDD" stroke-width="0.5"/>
  <!-- Current location pin -->
  <circle cx="187" cy="260" r="8" fill="#666666" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="187" cy="260" r="3" fill="#FFFFFF"/>

  <!-- Where to? Search Bar -->
  <rect x="16" y="416" width="343" height="52" rx="26" fill="#F0F0F0" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Search icon -->
  <circle cx="44" cy="442" r="9" fill="none" stroke="#999999" stroke-width="2"/>
  <line x1="51" y1="449" x2="57" y2="455" stroke="#999999" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="447" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#999999">Where to?</text>

  <!-- Add Stop Link -->
  <rect x="16" y="480" width="343" height="44" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Plus icon circle -->
  <circle cx="44" cy="502" r="12" fill="none" stroke="#555555" stroke-width="1.5"/>
  <line x1="44" y1="496" x2="44" y2="508" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="502" x2="50" y2="502" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <text x="66" y="507" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" font-weight="500">Add Stop</text>

  <!-- Stop 1 Input Field -->
  <rect x="16" y="536" width="343" height="50" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Stop number -->
  <circle cx="44" cy="561" r="11" fill="#E0E0E0" stroke="#AAAAAA" stroke-width="1"/>
  <text x="44" y="565" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="bold">1</text>
  <!-- Input field -->
  <rect x="66" y="548" width="264" height="26" rx="4" fill="#F7F7F7" stroke="#DDDDDD" stroke-width="1"/>
  <text x="76" y="566" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#BBBBBB">Enter destination...</text>
  <!-- Cursor blink indicator -->
  <line x1="74" y1="552" x2="74" y2="570" stroke="#555555" stroke-width="1.5"/>

  <!-- Add another stop link -->
  <rect x="16" y="598" width="343" height="40" rx="8" fill="none"/>
  <circle cx="44" cy="618" r="10" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="44" y1="613" x2="44" y2="623" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="618" x2="49" y2="618" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
  <text x="66" y="623" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Add another stop</text>

  <!-- Divider -->
  <line x1="16" y1="660" x2="359" y2="660" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Bottom Navigation Tabs -->
  <rect x="0" y="740" width="375" height="72" fill="#F5F5F5"/>
  <line x1="0" y1="740" x2="375" y2="740" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Ride Now Tab (active) -->
  <circle cx="62" cy="762" r="12" fill="none" stroke="#333333" stroke-width="1.5"/>
  <path d="M56 765 L62 758 L68 765" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="62" y1="758" x2="62" y2="768" stroke="#333333" stroke-width="1.5"/>
  <text x="62" y="788" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">Ride Now</text>

  <!-- Schedule Tab -->
  <rect x="175" y="752" width="20" height="20" rx="3" fill="none" stroke="#999999" stroke-width="1.5"/>
  <line x1="180" y1="749" x2="180" y2="754" stroke="#999999" stroke-width="1.5"/>
  <line x1="190" y1="749" x2="190" y2="754" stroke="#999999" stroke-width="1.5"/>
  <line x1="175" y1="760" x2="195" y2="760" stroke="#999999" stroke-width="1"/>
  <text x="187" y="788" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle">Schedule</text>

  <!-- History Tab -->
  <circle cx="312" cy="762" r="10" fill="none" stroke="#999999" stroke-width="1.5"/>
  <polyline points="312,755 312,762 317,762" fill="none" stroke="#999999" stroke-width="1.5" stroke-linecap="round"/>
  <text x="312" y="788" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#999999" text-anchor="middle">History</text>
</svg>
