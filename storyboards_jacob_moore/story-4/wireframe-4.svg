<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="30" ry="30" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="30" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">9:41 AM</text>
  <text x="310" y="28" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">100%</text>
  <rect x="340" y="18" width="22" height="12" rx="2" ry="2" fill="none" stroke="#333333" stroke-width="1.5"/>
  <rect x="362" y="22" width="3" height="4" rx="1" fill="#333333"/>
  <rect x="342" y="20" width="16" height="8" rx="1" fill="#333333"/>

  <!-- Header Bar -->
  <rect x="0" y="44" width="375" height="56" fill="#F5F5F5"/>
  <text x="187" y="76" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" font-weight="bold" text-anchor="middle">Trip Complete</text>
  <!-- Checkmark -->
  <circle cx="310" cy="72" r="14" fill="#555555"/>
  <polyline points="302,72 308,78 318,66" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trip Summary Card -->
  <rect x="16" y="120" width="343" height="400" rx="16" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Card Title -->
  <text x="36" y="156" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#888888" font-weight="500">TRIP SUMMARY</text>

  <!-- Vertical timeline line -->
  <line x1="52" y1="190" x2="52" y2="440" stroke="#BBBBBB" stroke-width="2"/>

  <!-- Stop 0: Home -->
  <circle cx="52" cy="190" r="8" fill="#555555" stroke="#FFFFFF" stroke-width="2"/>
  <text x="76" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="bold">Home</text>
  <text x="76" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Departed 7:20 AM</text>
  <!-- Time on right side -->
  <text x="338" y="194" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">7:20 AM</text>

  <!-- Travel time indicator -->
  <text x="52" y="234" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">15 min</text>

  <!-- Stop 1: Lincoln Elementary -->
  <circle cx="52" cy="270" r="10" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="52" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle" font-weight="bold">1</text>
  <text x="76" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="bold">Lincoln Elementary</text>
  <text x="76" y="284" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Drop-off completed</text>
  <text x="338" y="274" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">7:35 AM</text>

  <!-- Travel time indicator -->
  <text x="52" y="318" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">15 min</text>

  <!-- Stop 2: Sunshine Daycare -->
  <circle cx="52" cy="350" r="10" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="52" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle" font-weight="bold">2</text>
  <text x="76" y="346" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="bold">Sunshine Daycare</text>
  <text x="76" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Drop-off completed</text>
  <text x="338" y="354" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">7:50 AM</text>

  <!-- Travel time indicator -->
  <text x="52" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">20 min</text>

  <!-- Stop 3: Maria's Office (Final) -->
  <circle cx="52" cy="432" r="10" fill="#555555" stroke="#333333" stroke-width="2"/>
  <text x="52" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="76" y="428" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" font-weight="bold">Maria's Office</text>
  <text x="76" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#888888">Arrived - Final destination</text>
  <text x="338" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">8:10 AM</text>

  <!-- Completed check marks on each stop -->
  <circle cx="336" cy="204" r="8" fill="none" stroke="#777777" stroke-width="1"/>
  <polyline points="332,204 335,207 340,201" fill="none" stroke="#777777" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="336" cy="284" r="8" fill="none" stroke="#777777" stroke-width="1"/>
  <polyline points="332,284 335,287 340,281" fill="none" stroke="#777777" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="336" cy="364" r="8" fill="none" stroke="#777777" stroke-width="1"/>
  <polyline points="332,364 335,367 340,361" fill="none" stroke="#777777" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="336" cy="446" r="8" fill="none" stroke="#777777" stroke-width="1"/>
  <polyline points="332,446 335,449 340,443" fill="none" stroke="#777777" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Divider in card -->
  <line x1="36" y1="472" x2="339" y2="472" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Totals -->
  <text x="36" y="502" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#555555" font-weight="500">Total Trip</text>
  <text x="338" y="502" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333" text-anchor="end" font-weight="bold">35 min -- $23.50</text>

  <!-- Star Rating Section -->
  <text x="187" y="568" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle">Rate your trip</text>

  <!-- 5 Stars -->
  <g transform="translate(97, 585)">
    <!-- Star 1 -->
    <polygon points="18,0 23,12 36,14 26,22 29,35 18,28 7,35 10,22 0,14 13,12" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Star 2 -->
    <polygon points="54,0 59,12 72,14 62,22 65,35 54,28 43,35 46,22 36,14 49,12" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Star 3 -->
    <polygon points="90,0 95,12 108,14 98,22 101,35 90,28 79,35 82,22 72,14 85,12" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Star 4 -->
    <polygon points="126,0 131,12 144,14 134,22 137,35 126,28 115,35 118,22 108,14 121,12" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Star 5 -->
    <polygon points="162,0 167,12 180,14 170,22 173,35 162,28 151,35 154,22 144,14 157,12" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Buttons -->
  <!-- Rate Trip Button -->
  <rect x="24" y="652" width="155" height="52" rx="26" fill="#333333"/>
  <text x="101" y="684" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Rate Trip</text>

  <!-- Done Button -->
  <rect x="196" y="652" width="155" height="52" rx="26" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="273" y="684" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Done</text>
</svg>
