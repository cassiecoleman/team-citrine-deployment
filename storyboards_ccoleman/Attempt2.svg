<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .p{fill:#fff;stroke:#111827;stroke-width:2;rx:18;ry:18}
      .ui{fill:#F3F4F6;stroke:#9CA3AF;stroke-width:1.5;rx:14;ry:14}
      .phone{fill:#fff;stroke:#111827;stroke-width:2.2;rx:22;ry:22}
      .dot{fill:#111827}
      .mut{stroke:#9CA3AF;stroke-width:2}
      .ok{fill:#10B981}
      .warn{fill:#F59E0B}
      .blue{fill:#DBEAFE;stroke:#111827;stroke-width:2}
      .green{fill:#ECFDF5;stroke:#111827;stroke-width:2}
      .dark{fill:#111827}
      .light{fill:#E5E7EB}
    </style>
  </defs>

  <!-- Panels -->
  <rect class="p" x="20" y="20" width="380" height="230"></rect>
  <rect class="p" x="410" y="20" width="380" height="230"></rect>
  <rect class="p" x="800" y="20" width="380" height="230"></rect>
  <rect class="p" x="20" y="270" width="380" height="230"></rect>
  <rect class="p" x="410" y="270" width="380" height="230"></rect>
  <rect class="p" x="800" y="270" width="380" height="230"></rect>

  <!-- Panel 1: user + alarm -->
  <circle cx="95" cy="120" r="20" fill="#FDE68A" stroke="#111827" stroke-width="2"></circle>
  <rect x="70" y="142" width="50" height="60" fill="#BFDBFE" stroke="#111827" stroke-width="2" rx="10"></rect>
  <circle class="warn" cx="165" cy="155" r="16"></circle>
  <path d="M165 145 v12 l10 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
  <path d="M145 135 l-10 -10 M185 135 l10 -10" class="mut" stroke-linecap="round"></path>

  <!-- Panel 2: phone home/work -->
  <rect class="phone" x="645" y="60" width="120" height="170"></rect>
  <rect class="dark" x="660" y="72" width="90" height="10" rx="5"></rect>
  <rect class="ui" x="655" y="95" width="100" height="36"></rect>
  <circle cx="668" cy="113" r="6" fill="#EF4444"></circle>
  <rect class="ui" x="655" y="140" width="100" height="36"></rect>
  <circle cx="668" cy="158" r="6" fill="#10B981"></circle>

  <!-- Panel 3: calendar + shield -->
  <rect class="phone" x="1015" y="60" width="150" height="170"></rect>
  <rect class="dark" x="1032" y="72" width="118" height="10" rx="5"></rect>
  <rect class="ui" x="1030" y="95" width="120" height="90"></rect>
  <rect x="1030" y="95" width="120" height="18" fill="#111827" rx="10"></rect>
  <g transform="translate(1044 122)">
    <rect width="16" height="14" class="light" rx="3"></rect>
    <rect x="22" width="16" height="14" class="light" rx="3"></rect>
    <rect x="44" width="16" height="14" class="light" rx="3"></rect>
    <rect y="20" width="16" height="14" class="light" rx="3"></rect>
    <rect x="22" y="20" width="16" height="14" class="light" rx="3"></rect>
    <rect x="44" y="20" width="16" height="14" class="light" rx="3"></rect>
  </g>
  <path d="M860 210 c20 -30 60 -30 80 0 c-10 40 -30 55 -40 60 c-10 -5 -30 -20 -40 -60z" fill="#DBEAFE" stroke="#111827" stroke-width="2"></path>
  <path d="M888 220 l10 12 l18 -24" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

  <!-- Panel 4: confirmation check -->
  <rect class="phone" x="250" y="300" width="130" height="180"></rect>
  <rect class="dark" x="265" y="312" width="100" height="10" rx="5"></rect>
  <rect class="ui" x="265" y="330" width="100" height="60"></rect>
  <circle class="ok" cx="345" cy="376" r="12"></circle>
  <path d="M339 376 l5 6 l10 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
  <rect x="265" y="404" width="110" height="34" rx="12" fill="#111827"></rect>

  <!-- Panel 5: morning notification -->
  <rect class="ui" x="430" y="350" width="330" height="120"></rect>
  <circle class="ok" cx="720" cy="376" r="12"></circle>
  <path d="M714 376 l5 6 l10 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle class="dot" cx="465" cy="376" r="6"></circle>
  <line class="mut" x1="480" y1="370" x2="690" y2="370"></line>
  <line class="mut" x1="465" y1="405" x2="720" y2="405"></line>
  <line class="mut" x1="465" y1="430" x2="640" y2="430"></line>

  <!-- Panel 6: arrival at work -->
  <rect class="blue" x="840" y="350" width="150" height="90" rx="14"></rect>
  <path d="M875 395 h80" stroke="#111827" stroke-width="3" stroke-linecap="round"></path>
  <circle cx="880" cy="420" r="6" fill="#111827"></circle>
  <circle cx="950" cy="420" r="6" fill="#111827"></circle>
  <rect class="green" x="1010" y="340" width="150" height="110" rx="14"></rect>
  <rect x="1040" y="362" width="90" height="60" fill="#E5E7EB" stroke="#111827" stroke-width="2" rx="10"></rect>
  <circle class="ok" cx="1145" cy="365" r="12"></circle>
</svg>
