<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <defs>
    <clipPath id="screenClip3">
      <rect x="0" y="0" width="375" height="812" rx="40" ry="40"/>
    </clipPath>
  </defs>

  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="40" ry="40" fill="#fff" stroke="#333" stroke-width="2"/>

  <g clip-path="url(#screenClip3)">

    <!-- Status Bar -->
    <rect x="0" y="0" width="375" height="44" fill="#fff"/>
    <text x="187" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9:41</text>
    <!-- Signal bars -->
    <rect x="20" y="20" width="3" height="6" rx="1" fill="#333"/>
    <rect x="25" y="17" width="3" height="9" rx="1" fill="#333"/>
    <rect x="30" y="14" width="3" height="12" rx="1" fill="#333"/>
    <rect x="35" y="11" width="3" height="15" rx="1" fill="#333"/>
    <!-- Battery -->
    <rect x="330" y="17" width="22" height="11" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="352" y="20" width="2" height="5" rx="1" fill="#333"/>
    <rect x="332" y="19" width="16" height="7" rx="1" fill="#333"/>

    <!-- Navigation Bar -->
    <rect x="0" y="44" width="375" height="56" fill="#fff"/>
    <line x1="0" y1="100" x2="375" y2="100" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Back arrow -->
    <path d="M24 72 L14 72" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 66 L12 72 L18 78" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Title -->
    <text x="48" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Review Your Pass</text>

    <!-- Summary Card -->
    <rect x="20" y="120" width="335" height="320" rx="14" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>

    <!-- Card Header -->
    <rect x="20" y="120" width="335" height="50" rx="14" fill="#f5f5f5"/>
    <rect x="20" y="156" width="335" height="14" fill="#f5f5f5"/>
    <text x="187" y="152" font-family="Arial" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Pass Summary</text>

    <!-- Route row -->
    <text x="40" y="198" font-family="Arial" font-size="13" fill="#999">Route</text>
    <text x="335" y="198" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="end">Home &#x2192; Office</text>
    <line x1="40" y1="214" x2="335" y2="214" stroke="#f5f5f5" stroke-width="1"/>

    <!-- Plan row -->
    <text x="40" y="242" font-family="Arial" font-size="13" fill="#999">Plan</text>
    <text x="335" y="242" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="end">5 rides / week</text>
    <line x1="40" y1="258" x2="335" y2="258" stroke="#f5f5f5" stroke-width="1"/>

    <!-- Price row -->
    <text x="40" y="286" font-family="Arial" font-size="13" fill="#999">Price</text>
    <text x="335" y="286" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="end">$75 / week</text>
    <line x1="40" y1="302" x2="335" y2="302" stroke="#f5f5f5" stroke-width="1"/>

    <!-- Billing row -->
    <text x="40" y="330" font-family="Arial" font-size="13" fill="#999">Billing</text>
    <text x="335" y="330" font-family="Arial" font-size="14" fill="#333" text-anchor="end">Weekly, auto-renew</text>
    <line x1="40" y1="346" x2="335" y2="346" stroke="#f5f5f5" stroke-width="1"/>

    <!-- Starts row -->
    <text x="40" y="374" font-family="Arial" font-size="13" fill="#999">Starts</text>
    <text x="335" y="374" font-family="Arial" font-size="14" fill="#333" text-anchor="end">Tomorrow, Mon</text>
    <line x1="40" y1="390" x2="335" y2="390" stroke="#f5f5f5" stroke-width="1"/>

    <!-- Savings row -->
    <text x="40" y="418" font-family="Arial" font-size="13" fill="#999">Est. Savings</text>
    <rect x="230" y="404" width="105" height="22" rx="11" fill="#f5f5f5"/>
    <text x="282" y="419" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">~$25/week</text>

    <!-- Payment Method -->
    <rect x="20" y="462" width="335" height="64" rx="14" fill="#f5f5f5"/>
    <text x="40" y="485" font-family="Arial" font-size="12" fill="#999">PAYMENT METHOD</text>
    <!-- Card icon -->
    <rect x="40" y="497" width="28" height="18" rx="3" fill="#333"/>
    <line x1="40" y1="505" x2="68" y2="505" stroke="#666" stroke-width="1"/>
    <text x="78" y="512" font-family="Arial" font-size="14" fill="#333">Visa ending 4821</text>
    <!-- Edit link -->
    <text x="335" y="512" font-family="Arial" font-size="12" fill="#666" text-anchor="end">Change</text>

    <!-- Terms -->
    <rect x="20" y="546" width="335" height="70" rx="14" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
    <text x="40" y="572" font-family="Arial" font-size="12" fill="#999">Cancel anytime before next billing cycle.</text>
    <text x="40" y="592" font-family="Arial" font-size="12" fill="#999">Unused rides don't roll over to the next week.</text>
    <!-- Info icon -->
    <circle cx="335" cy="576" r="10" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="335" y="581" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">i</text>

    <!-- Terms checkbox -->
    <rect x="20" y="636" width="335" height="44" rx="10" fill="#fff"/>
    <rect x="28" y="648" width="18" height="18" rx="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <polyline points="32,658 36,662 44,652" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="662" font-family="Arial" font-size="13" fill="#666">I agree to the </text>
    <text x="158" y="662" font-family="Arial" font-size="13" fill="#333" text-decoration="underline">terms &amp; conditions</text>

    <!-- Subscribe Button -->
    <rect x="20" y="700" width="335" height="54" rx="27" fill="#333"/>
    <text x="187" y="733" font-family="Arial" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Subscribe &#x2014; $75/week</text>

  </g>
</svg>