<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Arial, Helvetica, sans-serif">
  <!-- Phone Frame -->
  <rect x="0" y="0" width="375" height="812" rx="36" ry="36" fill="#fff" stroke="#333" stroke-width="2"/>

  <!-- Status Bar -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="375" height="44" rx="36" ry="36" fill="#f5f5f5"/>
    <rect x="0" y="20" width="375" height="24" fill="#f5f5f5"/>
    <text x="187" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9:41</text>
    <!-- Signal Bars -->
    <rect x="30" y="20" width="3" height="6" rx="1" fill="#333"/>
    <rect x="35" y="18" width="3" height="8" rx="1" fill="#333"/>
    <rect x="40" y="15" width="3" height="11" rx="1" fill="#333"/>
    <rect x="45" y="12" width="3" height="14" rx="1" fill="#333"/>
    <!-- Battery -->
    <rect x="325" y="16" width="22" height="12" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="347" y="20" width="2" height="4" rx="1" fill="#333"/>
    <rect x="327" y="18" width="16" height="8" rx="1" fill="#333"/>
  </g>

  <!-- Navigation Bar -->
  <g transform="translate(0,44)">
    <rect x="0" y="0" width="375" height="56" fill="#fff"/>
    <line x1="0" y1="56" x2="375" y2="56" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Hamburger Menu -->
    <line x1="20" y1="20" x2="40" y2="20" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="40" y2="28" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="40" y2="36" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Title -->
    <text x="187" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Ultra</text>
    <!-- Bell Icon -->
    <circle cx="348" cy="24" r="8" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="16" x2="348" y2="12" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <circle cx="348" cy="34" r="2" fill="#333"/>
  </g>

  <!-- Checkmark Circle -->
  <g transform="translate(187,150)">
    <circle cx="0" cy="0" r="36" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <polyline points="-14,0 -4,12 16,-10" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Page Header -->
  <text x="187" y="210" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Ride Complete</text>

  <!-- Receipt Card -->
  <g transform="translate(20,240)">
    <rect x="0" y="0" width="335" height="180" rx="12" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="20" y="30" font-size="13" font-weight="bold" fill="#999">RECEIPT</text>

    <!-- Divider -->
    <line x1="20" y1="44" x2="315" y2="44" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Total fare -->
    <text x="20" y="72" font-size="15" fill="#666">Total fare</text>
    <text x="315" y="72" text-anchor="end" font-size="15" font-weight="bold" fill="#333">$19.00</text>

    <!-- Divider -->
    <line x1="20" y1="86" x2="315" y2="86" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Your share -->
    <text x="20" y="112" font-size="15" fill="#333">Your share</text>
    <text x="315" y="112" text-anchor="end" font-size="18" font-weight="bold" fill="#333">$9.50</text>

    <!-- Kenji's share -->
    <text x="20" y="140" font-size="15" fill="#666">Kenji's share</text>
    <text x="315" y="140" text-anchor="end" font-size="15" fill="#666">$9.50</text>

    <!-- Divider -->
    <line x1="20" y1="154" x2="315" y2="154" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Payment method -->
    <text x="20" y="174" font-size="12" fill="#999">Paid via Visa ****4821</text>
  </g>

  <!-- Savings Callout -->
  <g transform="translate(20,440)">
    <rect x="0" y="0" width="335" height="60" rx="12" fill="#333"/>
    <!-- Savings icon -->
    <circle cx="40" cy="30" r="16" fill="#666"/>
    <text x="40" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">$</text>
    <text x="70" y="26" font-size="14" fill="#f5f5f5">You saved</text>
    <text x="70" y="46" font-size="20" font-weight="bold" fill="#fff">$9.50 by splitting!</text>
  </g>

  <!-- Rate Your Driver -->
  <g transform="translate(20,524)">
    <text x="167" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Rate your driver</text>

    <!-- Driver name -->
    <text x="167" y="44" text-anchor="middle" font-size="14" fill="#666">Marcus R.</text>

    <!-- 5 Stars (empty/outlined) -->
    <g transform="translate(77,56)">
      <!-- Star 1 -->
      <polygon points="22,2 27,16 42,16 30,25 34,40 22,31 10,40 14,25 2,16 17,16" fill="none" stroke="#999" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Star 2 -->
      <polygon points="66,2 71,16 86,16 74,25 78,40 66,31 54,40 58,25 46,16 61,16" fill="none" stroke="#999" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Star 3 -->
      <polygon points="110,2 115,16 130,16 118,25 122,40 110,31 98,40 102,25 90,16 105,16" fill="none" stroke="#999" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Star 4 -->
      <polygon points="154,2 159,16 174,16 162,25 166,40 154,31 142,40 146,25 134,16 149,16" fill="none" stroke="#999" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Star 5 -->
      <polygon points="198,2 203,16 218,16 206,25 210,40 198,31 186,40 190,25 178,16 193,16" fill="none" stroke="#999" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- Tap to rate hint -->
    <text x="167" y="114" text-anchor="middle" font-size="12" fill="#999">Tap a star to rate</text>
  </g>

  <!-- Done Button -->
  <g transform="translate(20,700)">
    <rect x="0" y="0" width="335" height="54" rx="27" fill="#333"/>
    <text x="167" y="33" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">Done</text>
  </g>

  <!-- Bottom Bar Indicator -->
  <rect x="120" y="790" width="135" height="5" rx="3" fill="#333"/>
</svg>
